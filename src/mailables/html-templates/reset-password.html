<!DOCTYPE html>
<html>

<head>
    <style>
        .code-container {
            background-color: #f5f5f5;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            border-radius: 5px;
        }

        .reset-code {
            font-size: 32px;
            letter-spacing: 5px;
            font-weight: bold;
            color: #333;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <p>A request has been received to reset your password.</p>

    <p>Here is your 6-digit verification code:</p>

    <div class="code-container">
        <span class="reset-code">{{ resetCode }}</span>
    </div>

    <p>This code will expire in 1 hour.</p>

    <p>If you did not initiate this request, please ignore this message or contact us at support@gmail.com</p>

    <p>
        Thank you,<br />
        The Sport Booking Team<br />
    </p>
</body>

</html>
